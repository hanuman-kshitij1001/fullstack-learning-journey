<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Ye Less Ka Sign HTML me direct nahi hota to usse bhi haam ese karte hai  -->
    <h1>  a&lt;b   </h1>
    <p>kshtij &nbsp; tiwari </p>
    <!-- &nbsp = Provede space b/w content  -->
     <p>a &lt; b</p>
     <p>a &gt; b</p>
     <p>a &amp; b</p>
     <p>a &quot; b &quot; </p>
</body>
</html>


<!-- 

HTML ENTITIES
1- An HTML entity is a piece of text ("string") that begins with an ampersand (&) and ends with a semicolon (;).
2- Used to display reserved characters (which would otherwise be interpreted as HTML code), and invisible characters (like non-breaking spaces).
3- Can also use in place of characters that are difficult to type with a standard keyboard.
4- Browser interprets them & renders correct character




1-
Character :  &
Entity    :  &amp;
Note      :  Interpreted as the beginning of an entity or character reference.
2-
Character :  <
Entity    :  &lt;
Note      :  Interpreted as the beginning of a tag
3-
Character    >
Entity    :  &gt;
Note      :  Interpreted as the ending of a tag
4-
Character :  ";
Entity    :  &quot
Note      :  Interpreted as the beginning and end of an attribute's value.
-->
