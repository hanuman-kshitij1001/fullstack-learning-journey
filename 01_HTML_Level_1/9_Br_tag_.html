<!-- 

Bold Tag 
<b> Bold </b>

Italic Tag
<i> Italic </i>

UnderLine Tag
<u> Underline </u>

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <p>Twinkale twinkale  little star how  wonder little star </p> 
   <p>Twinkale twinkale <br> Little star <br> How  wonder little star </p> 
   <!-- Use here Bold Tag -->
   <p><b>Twinkale</b> Twinkale Little star  How  wonder little star </p>
   <!-- Use here Italic Tag --> 
   <p><i>Twinkale</i> Twinkale  Little star  How  wonder little star </p> 
   <!-- Use here Underline Tag --> 
   <p><u>Twinkale</u> Twinkale  Little star  How  wonder little star </p> 
</body>
</html>
