<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="3_2_HowToInclude_.css"/>
</head>
<body>
    
    <div class="container">
    <h2>Form Demo</h2>
    <form>
        <div class="row">
    <div class="mb-3" class="column">
        <lable class="form-lable" for="email">Email</lable>
        <input type="text" class="form-control" placeholder="Email" id="email">
    </div>
    <div class="mb-3" class="column">
        <lable class="form-lable" for="password">Password</lable>
        <input type="password" class="form-control" placeholder="Passwords" id="password">
    </div>
    <div class="mb-3" class="column">
        <lable class="form-lable" for="Address">Address</lable>
        <input type="text" class="form-control" placeholder="Address" id="Address">
    </div>
    </div>
    <div class="mb-3">
    <select class="form-select">
        <option selected>Choose Your City</option>
    <option value="1">Mumbai</option>
    <option value="2">Banglore</option>
    <option value="3">Hydrabad</option>
    <option value="4">Noida</option>
    <option value="5">Chainnai</option>
    </select>
</div>

<div class="normal mb-3">
    <input type="checkbox" id="agree">
    <lable for="agree">Agree</lable>
    
</div>
<div class="mb-3 from-check ">
    <input class="form-check-input" type="checkbox" id="agree">
    <lable class="form-check-lable" for="agree">Agree</lable>
    
</div>


<div class="mb-3 from-check ">
    <input class="form-check-input" type="radio" id="agree">
    <lable class="form-check-lable" for="agree">Yes/No</lable>
    
</div>

<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
  <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
</div>

</div>
</form>
</body>
</html>
