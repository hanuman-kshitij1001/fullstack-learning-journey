<!-- Table In Html  
 
<thead>  : Used To Wrap Table Header
    Agr Mujhe Herader Pata karna hai table ka to Use ham <thead> ke andhr likhte hai  done esliye use hota hai ye 
<tbody>  : Used To wrap Table Body
    Agr Mujhe table ki body ko  Pata karna hai to ham <tbody> ke andhr likhte hai  done esliye use hota hai ye 
<tfoot>  : Used To Wrap Table footer
    jis-ko Table ke footer ko Wrap Karne ke liye Use kia jata hai 



-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border ="Black">
        <!-- Ye apna Wo tabele ke bare me batate hai yaha pe   -->
        <caption>Table Caption</caption>
        <!-- Table Header -->
        <thead>
        <tr>
           
            <th>Item</th>
            <th>Price</th>
        </tr>
        </thead>
        <!-- Table Header End here  -->
        <!-- Table Body  -->
        <tbody>
        <tr>
            
            <td>Apple</td>
            <td>10</td>
        </tr>
        <tr>
            
            <td>Banana</td>
            <td>20</td>
        </tr>
        <tr>
           
            <td> Mango</td>
            <td> 30</td>
        </tr>
        </tbody>
        <!-- Table body End here  -->
    </table>
</body>
</html>
