<!-- Noe We can dicuss About  Order List Isme hame   Bahr wale tag me bass ye likhna hota hai  <ol>     </ol>  -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <ol type="a">
        <ul>
            <li><h2>Ghar Ka Rasan:</h2></li>
        </ul> 
            <li>Apple</li>
            <li>Banana</li>
            <li>Mango</li>
            <li>Khatam</li>
            <li>Apple</li>
            <li>Banana</li>
            <li>Mango</li>
            <li>Khatam</li>
            <li>Apple</li>
            <li>Banana</li>
    </ol>
 </body>
 </html>
