<!-- Important Points :
> data ko represent karne ke liye haam 3 alag alag tags Padhte hai HTML
1-<tr> : used to display table Row
2-<td> : used to display table Data
3-<th> : used to display table header 




-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- => ese hame ek table ki creation ki suruwat ho jati hai  -->
    <table border ="Black">
        <!-- Ye apna Wo tabele ke bare me batate hai yaha pe   -->
        <caption>Table Caption</caption>
        
        <tr>
           
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            
            <td>Apple</td>
            <td>10</td>
        </tr>
        <tr>
            
            <td>Banana</td>
            <td>20</td>
        </tr>
        <tr>
           
            <td> Mango</td>
            <td> 30</td>
        </tr>
    </table>
</body>
</html>
