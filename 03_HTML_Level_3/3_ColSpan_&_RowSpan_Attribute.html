<!-- 
This Are the Two Special Attribute 
used To create Cells Which spans Over Mulitiple rows or columns 

Span = EK cell Kitna Area Ocupi kar raha ahi table ke andhr 

Span =  1 roe & 1 col occupi karta hai genraliy but multiple bhi hota hai thats why he is come

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="" align="center">
        <caption>
            Food meanu
        </caption>
        <tHead>
            <tr>
              <th rowspan="2">Item</th>  
              <th colspan="2">Price</th>  
            </tr>
            <tr>
                <th>INR</th>
                <th>USD</th>
            </tr>
        </tHead>
            <tbody>
                <tr>
                    <td>Fruite</td>
                    <td>10 Rs</td>
                    <td>0.14$</td>
                </tr>
                <tr>
                    <td>Samosha</td>
                    <td>20 Rs</td>
                    <td>0.17$</td>
                </tr>
                <tr>
                    <td>Mango</td>
                    <td>50 Rs</td>
                    <td>1.17$</td>
                </tr>
            </tbody>
        
    </table>
</body>
</html>
